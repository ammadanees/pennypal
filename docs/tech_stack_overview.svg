<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadowLight" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="1280" height="720" fill="#F8FAFC"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1280" height="6" fill="#0284C7"/>

  <!-- Header -->
  <g transform="translate(80, 45)">
    <rect x="0" y="0" width="145" height="24" rx="12" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
    <text x="72" y="16" fill="#0369A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">TECHWIZ 7 STACK</text>
    
    <text x="0" y="52" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">PennyPal — Technology Stack Overview</text>
    <text x="0" y="74" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Cross-platform client, reactive state, offline cloud cache, and multimodal AI</text>
  </g>

  <!-- CENTER CORE CARD: FLUTTER -->
  <g transform="translate(470, 150)" filter="url(#cardShadowLight)">
    <rect width="340" height="380" rx="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="16" y="16" width="308" height="110" rx="12" fill="#F0F9FF" stroke="#BAE6FD"/>
    
    <!-- Flutter Icon Mockup -->
    <path d="M145,45 L170,70 L155,85 L130,60 Z" fill="#0284C7"/>
    <path d="M155,85 L175,105 L160,120 L140,100 Z" fill="#38BDF8"/>
    <path d="M175,105 L195,85 L210,100 L190,120 Z" fill="#0369A1"/>
    
    <text x="170" y="98" fill="#0C4A6E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Flutter 3.24</text>
    
    <text x="170" y="165" fill="#0284C7" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">SINGLE DART CODEBASE</text>
    <text x="170" y="190" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Multi-Platform Client</text>
    
    <!-- Platform Pills -->
    <g transform="translate(30, 215)">
      <rect x="0" y="0" width="60" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="30" y="17" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Android</text>
      
      <rect x="70" y="0" width="55" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="97" y="17" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">iOS</text>
      
      <rect x="135" y="0" width="55" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="162" y="17" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Web</text>
      
      <rect x="200" y="0" width="80" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="240" y="17" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Desktop</text>
    </g>

    <!-- Specs List -->
    <g transform="translate(35, 270)" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">
      <text x="0" y="15">• 60 FPS Material 3 Adaptive UI</text>
      <text x="0" y="40">• GoRouter Declarative Navigation</text>
      <text x="0" y="65">• Device Preview Multi-Screen Test</text>
      <text x="0" y="90">• Shared Code across Mobile &amp; Web</text>
    </g>
  </g>

  <!-- LEFT CARD 1: RIVERPOD -->
  <g transform="translate(80, 150)" filter="url(#cardShadowLight)">
    <rect width="350" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="175" rx="3" fill="#4F46E5"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="18" fill="#4F46E5" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">STATE MANAGEMENT</text>
      <text x="0" y="44" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="800">Riverpod 2.5</text>
      
      <text x="0" y="80" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Compile-time Safe State Providers</text>
      <text x="0" y="105" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Reactive Screen Rebuilds (Zero Lag)</text>
      <text x="0" y="130" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Clean Dependency Injection</text>
    </g>
  </g>

  <!-- LEFT CARD 2: FIRESTORE (OFFLINE DB) -->
  <g transform="translate(80, 355)" filter="url(#cardShadowLight)">
    <rect width="350" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="175" rx="3" fill="#EA580C"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="18" fill="#EA580C" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">DATABASE &amp; OFFLINE ENGINE</text>
      <text x="0" y="44" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="800">Cloud Firestore</text>
      
      <text x="0" y="80" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Local Cache Persistence (Zero-WiFi)</text>
      <text x="0" y="105" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Automatic Background Cloud Sync</text>
      <text x="0" y="130" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Per-User Firestore Security Rules</text>
    </g>
  </g>

  <!-- RIGHT CARD 1: GEMINI AI -->
  <g transform="translate(850, 150)" filter="url(#cardShadowLight)">
    <rect width="350" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="175" rx="3" fill="#0284C7"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="18" fill="#0284C7" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">ARTIFICIAL INTELLIGENCE</text>
      <text x="0" y="44" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="800">Google Gemini AI</text>
      
      <text x="0" y="80" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Multimodal Vision Receipt OCR</text>
      <text x="0" y="105" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Auto-Extracts Merchant, Date, Total</text>
      <text x="0" y="130" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Student AI Financial Assistant</text>
    </g>
  </g>

  <!-- RIGHT CARD 2: CLOUDINARY & BREVO -->
  <g transform="translate(850, 355)" filter="url(#cardShadowLight)">
    <rect width="350" height="175" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="175" rx="3" fill="#059669"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="18" fill="#059669" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">MEDIA &amp; ALERTS</text>
      <text x="0" y="44" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="800">Cloudinary &amp; Brevo</text>
      
      <text x="0" y="80" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Cloudinary: Receipt &amp; Avatar Media</text>
      <text x="0" y="105" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Brevo: Email Alerts &amp; Pass Reset</text>
      <text x="0" y="130" fill="#475569" font-family="sans-serif" font-size="12.5" font-weight="500">• Local Notifications for 80% Budget Cap</text>
    </g>
  </g>

  <!-- BOTTOM BAR -->
  <g transform="translate(80, 560)">
    <rect width="1120" height="65" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="560" y="28" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      SECURITY &amp; SYSTEM INTEGRITY
    </text>
    <text x="560" y="48" fill="#64748B" font-family="sans-serif" font-size="12" text-anchor="middle">
      Firebase Auth Role Separation • Zero Card CVV Storage • Strict Non-Banking Privacy Policy • 73 Unit Tests
    </text>
  </g>
</svg>
